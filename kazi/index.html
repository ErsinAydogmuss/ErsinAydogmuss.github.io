<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kazı: Derinliklerin Sırrı | Ücretsiz indir</title>
<meta name="description" content="Kapadokya'nın 150 metre altında bir sır var. Kaz, hazineleri bul, aletlerini geliştir. Kazı: Derinliklerin Sırrı App Store ve Google Play'de ücretsiz.">
<meta property="og:title" content="Kazı: Derinliklerin Sırrı">
<meta property="og:description" content="Kapadokya'nın 150 metre altında bir sır var. Ücretsiz indir!">
<meta property="og:image" content="https://ersinaydogmuss.github.io/kazi/key_art.jpg">
<meta property="og:url" content="https://ersinaydogmuss.github.io/kazi/">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Luckiest+Guy&display=swap">
<style>
  /* Kazı'nın indirme sayfası: reklamların ve profilin bağlantısı. Cihaza uygun mağaza düğmesi üstte (yönlendirme yok). */
  :root {
    --bg: #1d1410; --ink: #fff4e6; --soft: #d9c2a8; --gold: #ffc531;
    --apple: #111; --play: #1f8f4e; --card: rgba(29, 20, 16, 0.86);
    --display: "Luckiest Guy", "Arial Black", Impact, sans-serif;
    --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--body);
    display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background-image: linear-gradient(180deg, rgba(29,20,16,0.15), rgba(29,20,16,0.95) 70%), url("key_art.jpg");
    background-size: cover; background-position: center top;
  }
  main { width: 100%; max-width: 30rem; display: grid; gap: 18px; text-align: center; }
  .logo { width: min(78%, 320px); margin: 0 auto; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5)); }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 7vw, 2.2rem); line-height: 1.15;
       margin: 0; color: var(--gold); text-shadow: 0 3px 0 #000, 0 0 18px rgba(0,0,0,0.6); }
  .card { background: var(--card); border-radius: 18px; padding: 20px; display: grid; gap: 12px; }
  .card p { margin: 0; color: var(--soft); font-weight: 500; line-height: 1.5; }
  .stores { display: grid; gap: 12px; }
  .store { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 64px; border-radius: 14px;
           text-decoration: none; color: #fff; font-weight: 700; font-size: 1.15rem; border: 2px solid rgba(255,255,255,0.25); }
  .store small { display: block; font-size: 0.8rem; font-weight: 500; opacity: 0.85; line-height: 1.1; }
  .store span { text-align: left; line-height: 1.2; }
  .apple { background: var(--apple); }
  .play { background: var(--play); }
  .store svg { width: 30px; height: 30px; flex: none; fill: #fff; }
  .store:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .primary { order: -1; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,197,49,0.35); }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  li { background: rgba(255,197,49,0.15); color: var(--gold); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 0.9rem; }
  footer { font-size: 0.85rem; color: var(--soft); }
  footer a { color: var(--soft); }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Kazı">
  <h1>Kapadokya'nın 150 metre altında bir sır var!</h1>
  <div class="card">
    <p>Kaz, hazineleri bul, sat, aletlerini geliştir ve derinliklere in. Yeni harita Truva da seni bekliyor.</p>
    <ul><li>2 harita</li><li>11 çağ</li><li>192 hazine</li><li>Ücretsiz</li></ul>
    <div class="stores" id="stores">
      <a class="store apple" id="ios" href="https://apps.apple.com/app/id6829885440">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.86-.76-1.47.02-2.83.86-3.59 2.17-1.53 2.66-.39 6.6 1.1 8.75.73 1.05 1.6 2.24 2.73 2.2 1.1-.05 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.3-3.51zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.64-1.05 1.68-.92 2.67.97.08 1.96-.49 2.56-1.22z"/></svg>
        <span><small>Ücretsiz indir</small>App Store</span>
      </a>
      <a class="store play" id="android" href="https://play.google.com/store/apps/details?id=com.juiloot.kazi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1l9.8-9.7-9.8-9.7zm10.9 10.8 2.7 2.7-11.5 6.6 8.8-9.3zm3.8-3.8 3.1 1.8c.9.5.9 1.3 0 1.8l-3.2 1.8-3-2.7 3.1-2.7zM5.7 1.6l11.5 6.6-2.7 2.7-8.8-9.3z"/></svg>
        <span><small>Ücretsiz indir</small>Google Play</span>
      </a>
    </div>
  </div>
  <footer>Ersin Aydoğmuş · <a href="https://ersinaydogmuss.github.io/kazi-gizlilik/">Gizlilik politikası</a></footer>
</main>
<script>
  // Cihaza uygun mağazanın düğmesi üste çıkar ve parlar (sayfa kendiliğinden yönlendirmez).
  (function () {
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    var pick = ios ? "ios" : (android ? "android" : "");
    if (pick) document.getElementById(pick).classList.add("primary");
  })();
</script>
</body>
</html>
